<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="45%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Cloud Fill Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>

    <!-- Lightning Bolt & Message Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0c2340" flood-opacity="0.35"/>
    </filter>

    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Modern App Icon Rounded Badge -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle Glass Border -->
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="6"/>

  <!-- Main Symbol Group -->
  <g filter="url(#shadow)">
    <!-- Stylized Cloud Contour -->
    <path d="M176 368 h184 c48.6 0 88-39.4 88-88 0-44.2-32.6-80.8-75-87.1 -9.5-51.6-54.6-90.9-109-90.9 -53 0-97.3 37.6-108.2 87.5 -7.4-2.3-15.4-3.5-23.8-3.5 -46.4 0-84 37.6-84 84 0 54 44 98 98 98 z" fill="url(#cloudGrad)"/>

    <!-- High-Energy Lightning Bolt (SMS Symbol) -->
    <path d="M268 180 L195 285 h55 l-24 95 90 -115 h-58 l30 -85 z" fill="url(#boltGrad)" filter="url(#innerShadow)"/>

    <!-- Dynamic SMS Signal / Chat Accent Dots -->
    <circle cx="370" cy="220" r="14" fill="#F97316"/>
    <circle cx="398" cy="245" r="10" fill="#FB923C"/>
    <circle cx="414" cy="272" r="7" fill="#FDBA74"/>
  </g>
</svg>
