services:
  misms-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: misms-app
    restart: unless-stopped
    ports:
      # Tự động đồng bộ theo PORT trong file .env (mặc định 5000 nếu không khai báo)
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - ./backend/.env
    volumes:
      # QUAN TRỌNG: Mount thư mục frontend để khi bạn sửa trực tiếp HTML hoặc upload ảnh trên Admin,
      # dữ liệu được lưu bền vững trên ổ cứng VPS thật (không bị mất khi restart container)
      - ./frontend:/app/frontend
      # Mount thư mục db để dữ liệu danh bạ/tin nhắn liên hệ được lưu bền vững
      - ./backend/src/db:/app/backend/src/db
