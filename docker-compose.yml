services:
  misms-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: misms-app
    restart: unless-stopped
    ports:
      # Map cổng máy chủ VPS sang container (5000:5000)
      # Lưu ý: Cổng này hoàn toàn độc lập, không đụng cổng 4000 đang chạy của bạn
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=misms_secret_jwt_key_2026_change_in_prod
      - JWT_EXPIRES_IN=24h
    volumes:
      # QUAN TRỌNG: Mount thư mục frontend để khi bạn sửa trực tiếp HTML hoặc upload ảnh trên Admin,
      # dữ liệu được lưu bền vững trên ổ cứng VPS thật (không bị mất khi restart container)
      - ./frontend:/app/frontend
      # Mount thư mục db để dữ liệu danh bạ/tin nhắn liên hệ được lưu bền vững
      - ./backend/src/db:/app/backend/src/db
